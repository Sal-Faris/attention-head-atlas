[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "attention-head-atlas"
version = "0.1.0"
description = "Unsupervised population geometry of transformer attention-head operators"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy==2.5.2"]

[project.optional-dependencies]
analysis = [
  "pandas==3.0.5",
  "scipy==1.18.0",
  "scikit-learn==1.9.0",
  "matplotlib==3.11.1",
]
models = [
  "torch==2.13.0",
  "transformer-lens==3.7.2",
]
dev = ["pytest==9.1.1", "ruff==0.16.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
