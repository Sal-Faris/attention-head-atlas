[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "attention-head-atlas"
version = "0.1.0"
description = "Unsupervised population geometry of transformer attention-head operators"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
analysis = [
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
]
models = [
  "torch>=2.2",
  "transformer-lens>=2.0",
]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

